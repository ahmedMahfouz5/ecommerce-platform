grafana:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: kong
    annotations:
      konghq.com/protocols: "https"
      konghq.com/https-redirect-status-code: "301"
    hosts:
      - grafana.ahmedmahfouz.click
    path: /
    pathType: Prefix
  adminUser: admin
  adminPassword: admin
  persistence:
    enabled: true
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      # Automatically search all namespaces for ConfigMaps with the label 'grafana_dashboard: "1"'
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"

prometheus:
  enabled: true
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: 20GB
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: gp3
          resources:
            requests:
              storage: 2Gi

alertmanager:
  enabled: true

prometheus-operator:
  enabled: true
  tls:
    enabled: false