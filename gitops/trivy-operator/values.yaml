# =====================================================================
# Trivy Operator Helm Values
# =====================================================================

# Scan scope and target namespaces
targetNamespaces: "prod,monitoring,kong"
excludeNamespaces: "kube-system,kube-public,kube-node-lease,trivy-system"

# Operator core configuration
operator:
  replicas: 1
  logDevMode: false

# Scan job execution & lifecycle limits
scanJobsConcurrentLimit: 3
scanJobTimeout: 10m
scanJobTTL: 1h
scanJobsRetryDelay: 30s

# Security scanners enabled
vulnerabilityScannerEnabled: true
sbomGenerationEnabled: true
configAuditScannerEnabled: true
rbacAssessmentScannerEnabled: true
exposedSecretScannerEnabled: true

# Disabled scanners (kept explicit for clarity)
infraAssessmentScannerEnabled: false
clusterComplianceEnabled: false

# Metrics & Prometheus Integration
metricsFindingsEnabled: true
metricsVulnIdEnabled: true # Enabled to populate detailed CVE-level Grafana dashboards

serviceMonitor:
  enabled: true
  namespace: monitoring # Must match your Prometheus deployment namespace
  interval: 30s         # Optimized scrape interval for timely metric updates

# Trivy scanner container configurations
trivy:
  mode: Standalone
  severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
  ignoreUnfixed: false
  slow: true
  timeout: "10m"
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Scanner job security & reporting behaviors
trivyOperator:
  scanJobAutomountServiceAccountToken: false
  reportRecordFailedChecksOnly: true
  scanJobsInSameNamespace: false