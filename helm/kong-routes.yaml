# =============================================================================
# Kong declarative routing configuration (DB-less mode or DB mode)
#
# Apply after Kong is deployed:
#   kubectl create configmap kong-routes-config -n kong \
#     --from-file=kong-routes.yaml=helm/kong-routes.yaml
#
# Or use Kong's Ingress Controller CRDs (KongIngress, KongPlugin).
# =============================================================================
#
# Alternative approach — use Kubernetes Ingress resources with the Kong
# Ingress Controller. This is the recommended way to manage routes when
# using Kong in DB mode alongside its Ingress Controller.
#
# The IngressClass is "kong" and Kong watches for standard Ingress objects.
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-routes
  namespace: default
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
spec:
  ingressClassName: kong
  rules:
    # --- Backend API ---
    - host: api.ahmedmahfouz.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-prod
                port:
                  number: 8000

    # --- Frontend SPA ---
    - host: ahmedmahfouz.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-prod
                port:
                  number: 8080

    - host: www.ahmedmahfouz.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-prod
                port:
                  number: 8080

---
# =============================================================================
# KongPlugin: CORS for the API
# =============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: cors-plugin
  namespace: default
plugin: cors
config:
  origins:
    - "https://ahmedmahfouz.click"
    - "https://www.ahmedmahfouz.click"
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-MD5
    - Content-Type
    - Date
    - Authorization
  exposed_headers:
    - X-Auth-Token
  credentials: true
  max_age: 3600
  preflight_continue: false

---
# =============================================================================
# KongPlugin: Rate Limiting for the API
# =============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limiting-plugin
  namespace: default
plugin: rate-limiting
config:
  minute: 100
  hour: 1000
  policy: local
