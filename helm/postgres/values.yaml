# =============================================================================
# Postgres chart — local/CI only (production uses RDS)
# =============================================================================

# -- Override the full resource name (defaults to chart name)
fullnameOverride: postgres

# -- Container image
image: postgres:16-alpine

# -- Persistent storage
storage:
  size: 1Gi

# -- Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# -- External Secret (created manually with kubectl)
secret:
  name: ecommerce-secret
