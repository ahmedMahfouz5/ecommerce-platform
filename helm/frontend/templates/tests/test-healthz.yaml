apiVersion: v1
kind: Pod
metadata:
  name: {{ include "frontend.fullname" . }}-test-healthz
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command:
        - curl
        - -f
        - -s
        - -o
        - /dev/null
        - http://{{ include "frontend.fullname" . }}:{{ .Values.service.port }}/healthz
