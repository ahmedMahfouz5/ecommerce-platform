apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-nginx
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  default.conf.template: |
    # =========================================================================
    # Generated by Helm — rendered by nginx entrypoint at container startup
    # via envsubst on /etc/nginx/templates/default.conf.template.
    # Environment variables consumed:
    #   BACKEND_URL, NGINX_LOCAL_RESOLVERS,
    #   PROXY_READ_TIMEOUT, CLIENT_MAX_BODY_SIZE
    # =========================================================================

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       8080;
        server_name  _;
        server_tokens off;

        client_max_body_size ${CLIENT_MAX_BODY_SIZE};

        gzip            on;
        gzip_vary       on;
        gzip_min_length 512;
        gzip_types      text/plain text/css application/json application/javascript
                        text/xml application/xml application/xml+rss text/javascript
                        image/svg+xml;

        # Security headers
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "SAMEORIGIN"       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "interest-cohort=()" always;

        # DNS resolver
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

        # Backend API proxy
        location /api/ {
            set $backend_url "${BACKEND_URL}";
            proxy_pass $backend_url;

            proxy_http_version      1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout    5s;
            proxy_read_timeout       ${PROXY_READ_TIMEOUT};
        }

        # Health check (does not depend on backend)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Static assets
        root /usr/share/nginx/html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri /index.html;
        }
    }
