# =============================================================================
# Frontend — production overrides
#
#   helm install frontend-prod ./helm/frontend -f helm/frontend/values-prod.yaml
# =============================================================================

replicaCount: 2

backendUrl: "http://backend-prod:8000"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /healthz
    port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12

# -- PodDisruptionBudget (ensure at least 1 pod is always available)
pdb:
  enabled: true
  minAvailable: 1

# -- HPA for autoscaling
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -- Topology spread across nodes
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# -- Rolling update: never have fewer than replicaCount pods
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Ingress: disabled — routing is via Kong Gateway internal proxy.
# Kong handles hostname-based routing: frontend.example.com → frontend Service.
ingress:
  enabled: false

# -- NetworkPolicy: restrict ingress to Kong namespace
networkPolicy:
  enabled: true
  ingressControllerNamespace: kong

# -- Dedicated ServiceAccount
serviceAccount:
  create: true

automountServiceAccountToken: false

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 10

podAnnotations:
  environment: production
