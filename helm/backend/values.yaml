# =============================================================================
# Backend chart — FastAPI application + Alembic migration Job
#
# Every setting is environment-agnostic. Environment-specific overrides belong
# in values-dev.yaml / values-staging.yaml / values-prod.yaml.
# =============================================================================

# -- Override resource naming (empty = use release name + chart name)
nameOverride: ""
fullnameOverride: ""
# ===========================================================================
# Image
# ===========================================================================
image:
  # -- Container image repository (REQUIRED)
  repository: ahmedmahfouz0/backend
  # -- Image tag (REQUIRED — set at install/upgrade time, usually git SHA)
  tag: "d116e26e9ff2fed4b08f7006ca9fa04ed6347db6"
  # -- Image digest (optional) — when set, overrides tag; e.g. sha256:abc123…
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent
# -- Image pull secrets (e.g. for private registries)
imagePullSecrets: []
#   - name: regcred

# ===========================================================================
# Replicas & updates
# ===========================================================================
# -- Number of replicas. Omit (or set to null) when HPA is enabled.
#    Default 1 is safe for dev; production should set >= 2.
replicaCount: 1
# -- Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# ===========================================================================
# Secrets
#
# Two modes:
#   1) existingSecret (default): reference a pre-created Secret
#   2) secrets.create: true — chart creates the Secret (supply values at deploy
#      time via --set, never commit real values)
#
# When secrets.create is true, DATABASE_URL is assembled from the individual
# db* fields below.  When secrets.create is false, DATABASE_URL must exist in
# the existing Secret (see secretKeys.databaseUrl).
# ===========================================================================
secrets:
  # -- Create a Secret from chart values. If false, existingSecret must be provided.
  create: false
  # -- Name of existing Secret to use (required when create is false)
  existingSecret: "ecommerce-secret"
  # -- Key names inside the Secret (used in both modes)
  secretKeys:
    databaseUrl: "DATABASE_URL"
    secretKey: "SECRET_KEY"
  # -- Secret values (only used when secrets.create is true).
  #    NEVER commit real values here — set them at deploy time.
  db:
    host: ""
    port: "5432"
    user: "postgres"
    name: "ecommerce"
    password: ""
  flaskSecretKey: ""
# ===========================================================================
# Non-secret application configuration
#
# Rendered as a ConfigMap and loaded via envFrom.
# ===========================================================================
config:
  # -- Comma-separated CORS origins
  corsOrigins: "http://localhost:5173,http://localhost:3000"
  # -- Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  logLevel: "INFO"
  # -- Backend listen port (must match containerPort in the Deployment)
  port: 8000
  # -- Forwarded-allow-ips for uvicorn ("*" trusts all)
  forwardedAllowIps: "*"
  # -- AWS region for S3 client
  awsRegion: "us-east-2"
  # -- S3 bucket name for product-image assets
  s3AssetsBucket: "ecommerce-staging-us-east-2-assets"
  # -- Presigned URL lifetime in seconds
  s3PresignedUrlExpirationSeconds: "300"
  # -- Arbitrary extra env vars (name/value pairs) added to the ConfigMap
  extraEnv: {}
  #   FEATURE_NEW_CHECKOUT: "false"
# ===========================================================================
# Extra environment (passthrough lists)
# ===========================================================================
env: []
#   - name: MY_VAR
#     value: "my-value"

envFrom: []
#   - secretRef:
#       name: extra-secret
# ===========================================================================
# Service
# ===========================================================================
service:
  type: ClusterIP
  port: 8000
  # -- Additional annotations on the Service
  annotations: {}
# ===========================================================================
# Probes (liveness, readiness, startup)
# ===========================================================================
probes:
  liveness:
    path: /api/v1/health/live
    port: http
    initialDelaySeconds: 12
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /api/v1/health/ready
    port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /api/v1/health/live
    port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12 # up to 60 s
# ===========================================================================
# Resources (requests & limits)
# ===========================================================================
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 384Mi
# ===========================================================================
# Security contexts
# ===========================================================================
# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
# -- Container-level security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
# -- emptyDir /tmp volume size limit
tmpSizeLimit:
  sizeLimit: 64Mi
# ===========================================================================
# ServiceAccount
# ===========================================================================
serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Name override (defaults to fullname)
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}
# -- Automount API token (set to true only if the app needs K8s API access)
automountServiceAccountToken: false
# ===========================================================================
# Priority class
# ===========================================================================
# -- PriorityClassName for the pod
priorityClassName: ""
# ===========================================================================
# PodDisruptionBudget
# ===========================================================================
pdb:
  enabled: false
  # -- Minimum number of pods that must remain available
  minAvailable: 1
  # -- Alternative: maximum unavailable pods
  # maxUnavailable: 1
# ===========================================================================
# HorizontalPodAutoscaler
# ===========================================================================
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
# ===========================================================================
# Ingress
# ===========================================================================
ingress:
  enabled: false
  className: nginx
  # -- Annotations passed to the Ingress resource
  annotations: {}
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
# ===========================================================================
# NetworkPolicy
# ===========================================================================
networkPolicy:
  enabled: false
  ingressControllerNamespaceLabels:
    "kubernetes.io/metadata.name": ingress-nginx
  egress:
    dns:
      enabled: true
      port: 53
    database:
      enabled: false
      # -- "external" for cloud DBs (requires 'host'), "internal" for in-cluster DBs
      type: external
      # -- External DB host (CIDR) — required when type=external
      host: ""
      # -- In-cluster DB namespace selector — set when type=internal AND DB is in a different namespace
      namespaceSelector: {}
      # -- In-cluster DB pod selector — required when type=internal
      podSelector: {}
      port: 5432
# ===========================================================================
# ServiceMonitor (Prometheus Operator)
# ===========================================================================
serviceMonitor:
  enabled: false
  interval: "30s"
  scrapeTimeout: "10s"
  path: /metrics
  labels: {}
  annotations: {}
  metricRelabelings: []
# ===========================================================================
# Pod scheduling
# ===========================================================================
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 10
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# ===========================================================================
# Extra annotations & labels
# ===========================================================================
podAnnotations: {}
podLabels: {}
# ===========================================================================
# Extra volumes & volume mounts
# ===========================================================================
extraVolumes: []
extraVolumeMounts: []
# ===========================================================================
# Helm test
# ===========================================================================
tests:
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
