# =============================================================================
# Backend — production overrides
#
# Apply on top of values.yaml:
#   helm upgrade --install backend-prod ./helm/backend -f helm/backend/values-prod.yaml
# =============================================================================

# At least 2 replicas across zones
replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 768Mi

config:
  corsOrigins: "https://example.com,https://admin.example.com"
  logLevel: "WARNING"
  # In production, limit forwarded-allow-ips to the ingress CIDR.
  # "*" is shown here only if you are behind a trusted LB; tighten when possible.
  forwardedAllowIps: "*"

# Production Ingress with TLS
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.example.com
      secretName: api-tls

# PodDisruptionBudget — keep at least 2 pods alive during voluntary disruptions
pdb:
  enabled: true
  minAvailable: 2

# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

# Topology spread — hard spread across zones
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule

# NetworkPolicy — lock down ingress/egress
networkPolicy:
  enabled: true
  ingressControllerNamespaceLabels:
    "kubernetes.io/metadata.name": ingress-nginx
  egress:
    dns:
      enabled: true
      port: 53
    database:
      enabled: true
      type: internal
      # In-cluster PostgreSQL (same namespace, so namespaceSelector is optional)
      # Leave namespaceSelector empty to default to the same namespace.
      # If PG lives in a different namespace, set matchLabels accordingly.
      namespaceSelector: {}
      podSelector:
        app.kubernetes.io/component: postgres
      port: 5432
# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  labels:
    release: prometheus

# Production priority class
priorityClassName: "high-priority"

# Graceful shutdown
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 15

# Migration job
migration:
  enabled: true
  dbWait:
    maxRetries: 60
    retryInterval: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

