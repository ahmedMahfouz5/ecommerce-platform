# =============================================================================
# Backend — production overrides
#
# Apply on top of values.yaml:
#   helm upgrade --install backend-prod ./helm/backend -f helm/backend/values-prod.yaml
# =============================================================================

# At least 2 replicas across zones
replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 768Mi

config:
  corsOrigins: "https://ahmedmahfouz.click,https://www.ahmedmahfouz.click"
  logLevel: "WARNING"
  # In production, limit forwarded-allow-ips to Kong's pod CIDR/cluster.
  # Kong sits in front and forwards requests, so trust the cluster CIDR.
  forwardedAllowIps: "*"

# Ingress: disabled — routing is handled by Kong Gateway via its
# internal Kubernetes Service discovery. Kong routes by hostname/path
# using KongIngress/Ingress resources or DB-less declarative config.
ingress:
  enabled: false

# PodDisruptionBudget — keep at least 2 pods alive during voluntary disruptions
pdb:
  enabled: true
  minAvailable: 2

# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 80

# Topology spread — hard spread across zones
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule

# NetworkPolicy — lock down ingress/egress
# Allow ingress from Kong namespace
networkPolicy:
  enabled: true
  ingressControllerNamespaceLabels:
    "kubernetes.io/metadata.name": kong
  egress:
    dns:
      enabled: true
      port: 53
    database:
      enabled: true
      type: internal
      namespaceSelector: {}
      podSelector:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: primary
      port: 5432

# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  labels:
    release: prometheus

# Production priority class
# priorityClassName: "high-priority"

# Graceful shutdown
terminationGracePeriodSeconds: 60
preStopSleepSeconds: 15


