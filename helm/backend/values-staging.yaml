# =============================================================================
# Backend — staging overrides
#
# Apply on top of values.yaml:
#   helm upgrade --install backend-staging ./helm/backend -f helm/backend/values-staging.yaml
# =============================================================================

# 2 replicas to mirror production topology
replicaCount: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  corsOrigins: "https://staging.example.com,https://admin-staging.example.com"
  logLevel: "INFO"
  forwardedAllowIps: "*"

# Enable PDB to protect during node drains
pdb:
  enabled: true
  minAvailable: 1

# Staging Ingress
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api-staging.example.com
      secretName: api-staging-tls

# Topology spread across zones (soft)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

