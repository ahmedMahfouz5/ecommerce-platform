{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backend.fullname" . }}-migration
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "1"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "backend.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migration.dbWait.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.migration.dbWait.image.repository }}:{{ .Values.migration.dbWait.image.tag }}
          imagePullPolicy: {{ .Values.migration.dbWait.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ required "migration.dbWait.pgHost is required when dbWait is enabled" .Values.migration.dbWait.pgHost }} \
                -p {{ .Values.migration.dbWait.pgPort }} \
                -U {{ required "migration.dbWait.pgUser is required" .Values.migration.dbWait.pgUser }} \
                -d {{ required "migration.dbWait.pgDb is required" .Values.migration.dbWait.pgDb }}; do
                echo "Waiting for Postgres..."
                sleep {{ .Values.migration.dbWait.retryInterval }}
              done
          {{- with .Values.migration.dbWait.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "backend.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.migration.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migration.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "backend.secretName" . }}
          {{- with .Values.migration.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            {{- toYaml .Values.tmpSizeLimit | nindent 12 }}
{{- end }}
