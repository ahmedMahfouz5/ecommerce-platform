{{- if .Values.secrets.create }}
{{- /* Assemble DATABASE_URL from individual db fields */}}
{{- $host := required "secrets.db.host is required when secrets.create is true" .Values.secrets.db.host }}
{{- $port := required "secrets.db.port is required when secrets.create is true" .Values.secrets.db.port }}
{{- $user := required "secrets.db.user is required when secrets.create is true" .Values.secrets.db.user }}
{{- $name := required "secrets.db.name is required when secrets.create is true" .Values.secrets.db.name }}
{{- $password := required "secrets.db.password is required when secrets.create is true" .Values.secrets.db.password }}
{{- $dbUrl := printf "postgresql+asyncpg://%s:%s@%s:%s/%s" $user $password $host $port $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.secrets.secretKeys.databaseUrl }}: {{ $dbUrl | quote }}
  {{ .Values.secrets.secretKeys.secretKey }}: {{ required "secrets.flaskSecretKey is required when secrets.create is true" .Values.secrets.flaskSecretKey | quote }}
{{- end }}

