apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.configMapName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
    {{- include "backend.selectorLabels" . | nindent 4 }}
data:
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FORWARDED_ALLOW_IPS: {{ .Values.config.forwardedAllowIps | quote }}
  BACKEND_PORT: {{ .Values.config.port | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  S3_ASSETS_BUCKET: {{ .Values.config.s3AssetsBucket | quote }}
  S3_PRESIGNED_URL_EXPIRATION_SECONDS: {{ .Values.config.s3PresignedUrlExpirationSeconds | quote }}
  {{- range $key, $val := .Values.config.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
