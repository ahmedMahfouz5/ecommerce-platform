apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "backend.fullname" . }}-test-connection"
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          # Retry loop — Cilium/CNI can take a few seconds to program network
          # policies for new pods, especially right after a fresh install.
          for i in $(seq 1 10); do
            if wget -qO- "http://{{ include "backend.fullname" . }}:{{ .Values.service.port }}/api/v1/health/live"; then
              exit 0
            fi
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done
          echo "FAILED: could not reach backend after 10 attempts"
          exit 1

