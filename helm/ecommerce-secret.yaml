# ecommerce-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/ecommerce"
  SECRET_KEY: "password"
  MONGODB_URL: "mongodb://mongo:27017/ecommerce"
  postgres-password: "password"