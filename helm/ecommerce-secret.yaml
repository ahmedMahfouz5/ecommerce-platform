# ecommerce-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: "prod"
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/ecommerce"
  SECRET_KEY: "password"
  postgres-password: "password"
  MONGODB_URL: "mongodb://root:password@mongodb:27017/ecommerce?authSource=admin"
  mongodb-root-password: "password"
  mongodb-passwords: "password"

