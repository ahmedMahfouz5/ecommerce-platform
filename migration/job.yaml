# =============================================================================
# Standalone Kubernetes Job — Alembic migration
#
# This Job is NOT a Helm hook.  It runs as a standalone resource that you
# apply manually *before* deploying a new backend version:
#
#   kubectl apply -f migration/job.yaml
#
# Once the Job succeeds, the migration is complete and you can safely roll
# out the backend Deployment.
#
# Adjust the values (image tag, secret name, resources, env vars) per
# environment before applying.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      # -------------------------------------------------------------------
      # Migration container
      # -------------------------------------------------------------------
      containers:
        - name: migrate
          # TODO: set the actual image tag (e.g. git SHA)
          image: ahmedmahfouz0/backend:6545cea5ba32e1719aaef62bf57ee5a48173bd12
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]

          envFrom:
            - secretRef:
                # TODO: change to the correct Secret name for the environment
                name: ecommerce-secret

          # -- extra env vars (uncomment and fill in as needed) --
          # env:
          #   - name: MY_VAR
          #     value: "my-value"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

