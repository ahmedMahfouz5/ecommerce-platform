# =============================================================================
# Kong Gateway — Helm values
#
# Kong is the in-cluster API Gateway. It is exposed via a Service of type
# LoadBalancer. The AWS Load Balancer Controller provisions an NLB in the
# public subnets to forward traffic to Kong's proxy port.
#
# TLS:
#   - NLB listener on port 443 terminates TLS using the ACM certificate.
#     (Configured via the service.beta.kubernetes.io/aws-load-balancer-*
#     annotations below.)
#   - Kong's proxy listens on port 8443 (TLS) and 8000 (HTTP).
#   - Backend services behind Kong use HTTP inside the cluster.
# =============================================================================

# ---------------------------------------------------------------------------
# Kong image & proxy
# ---------------------------------------------------------------------------
image:
  repository: kong
  tag: "3.7"

proxy:
  type: LoadBalancer

  # -- HTTP port
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
    nodePort: null

  # -- TLS/HTTPS port (NLB terminates, Kong receives on this)
  tls:
    enabled: true
    servicePort: 443
    containerPort: 8443
    nodePort: null

  # -- Annotations for the AWS Load Balancer Controller to provision an NLB
  annotations:
    # NLB (Network Load Balancer), internet-facing, in public subnets
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

    # TLS termination on the NLB: the ACM certificate ARN will be set at
    # deploy time via --set. Keep as a placeholder — Terraform will override.
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:..."
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"

    # Health check configuration
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "TCP"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8000"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"

    # External-DNS integration — creates Route 53 A record for this NLB
    external-dns.alpha.kubernetes.io/hostname: "api.ahmedmahfouz.click,*.api.ahmedmahfouz.click"

  # -- Ingress (disabled — we use the LoadBalancer Service directly)
  ingress:
    enabled: false

  # -- TLS secret for Kong's own proxy (optional — NLB already terminates TLS)
  #    If you want re-encryption to the pod, mount a cert-manager issued cert here.

# ---------------------------------------------------------------------------
# Database mode — "postgres" or "dbless"
# "dbless" is simpler: declarative config via DB-less mode.
# For production with dynamic route management, use "postgres".
# ---------------------------------------------------------------------------
env:
  database: "postgres"
  # PostgreSQL connection string — point to in-cluster PostgreSQL
  # Override at deploy time for your specific PG instance
  pg_host: "postgresql-primary.default.svc.cluster.local"
  pg_port: "5432"
  pg_database: "kong"
  pg_user: "kong"
  # pg_password should come from a Secret; set via --set at deploy time.
  # Set via env.secrets or separate secret. For now, set via --set.
  pg_password: "CHANGE_ME"

# ---------------------------------------------------------------------------
# Admin API — internal only (ClusterIP)
# ---------------------------------------------------------------------------
admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001
  tls:
    enabled: false

  # Disable admin ingress
  ingress:
    enabled: false

# ---------------------------------------------------------------------------
# Manager (Kong Manager UI) — internal only
# ---------------------------------------------------------------------------
manager:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8002
    containerPort: 8002
  tls:
    enabled: false
  ingress:
    enabled: false

# ---------------------------------------------------------------------------
# Enterprise features (disabled for OSS)
# ---------------------------------------------------------------------------
enterprise:
  enabled: false

# ---------------------------------------------------------------------------
# Plugins bundled with Kong OSS
# ---------------------------------------------------------------------------
# Kong OSS includes: cors, rate-limiting, key-auth, jwt, oauth2, etc.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# Autoscaling
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Replicas
# ---------------------------------------------------------------------------
replicaCount: 1

# ---------------------------------------------------------------------------
# Pod security
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
