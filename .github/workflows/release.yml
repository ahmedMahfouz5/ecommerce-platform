name: Release

on:
  # push:
  #   branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-push:
    needs: release-please
    #if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        component:
          - name: backend
            context: backend
            port: 8000
            health-endpoint: /api/v1/health
          - name: frontend
            context: frontend
            port: 8080
            health-endpoint: /
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ahmedmahfouz0/${{ matrix.component.name }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build image (no push yet)
        uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.component.context }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}

      - name: Smoke test
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          COMPONENT: ${{ matrix.component.name }}
          PORT: ${{ matrix.component.port }}
          HEALTH_ENDPOINT: ${{ matrix.component['health-endpoint'] }}
          RETRIES: 30
          RETRY_DELAY: 2
        run: ./scripts/smoke-test.sh

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          provenance: mode=max
          sbom: true
