name: CI

on:
  # push:
  #   branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ecommerce_test
          SECRET_KEY: test-secret
        run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: ecommerce-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke-test backend image
        run: |
          docker run -d --name backend-smoke -p 8000:8000 ecommerce-backend:${{ github.sha }}
          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo "Backend healthy"
              healthy=true
              break
            fi
            sleep 2
          done
          docker stop backend-smoke
          [ "$healthy" = true ] || { echo "Backend smoke test failed"; exit 1; }

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          tags: ecommerce-frontend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-test frontend image
        run: |
          docker run -d --name frontend-smoke -p 8080:8080 ecommerce-frontend:${{ github.sha }}
          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/; then
              echo "Frontend healthy"
              healthy=true
              break
            fi
            sleep 2
          done
          docker stop frontend-smoke
          [ "$healthy" = true ] || { echo "Frontend smoke test failed"; exit 1; }

