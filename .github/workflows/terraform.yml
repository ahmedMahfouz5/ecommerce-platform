name: Terraform

on:
  workflow_dispatch:
  # pull_request:
  #   paths: ["terraform/**"]   # plan-only on PRs; apply stays gated below

# One Terraform run at a time, shared with the destroy workflow
concurrency:
  group: terraform-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform/environments/prod

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN || 'arn:aws:iam::557797815982:role/github-actions-terraform' }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check (all modules)
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -lock-timeout=5m -no-color

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN || 'arn:aws:iam::557797815982:role/github-actions-terraform' }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init

      - name: Apply (vpc)
        run: terraform apply -target=module.vpc -auto-approve -lock-timeout=5m -no-color

      - name: Apply (iam)
        run: terraform apply -target=module.iam -auto-approve -lock-timeout=5m -no-color

      - name: Apply (eks)
        run: terraform apply -target=module.eks -auto-approve -lock-timeout=5m -no-color

      - name: Apply (ebs)
        run: terraform apply -target=module.ebs -auto-approve -lock-timeout=5m -no-color

      - name: Apply (eks-addons)
        run: terraform apply -target=module.eks-addons -auto-approve -lock-timeout=5m -no-color

      - name: Apply (remaining)
        run: terraform apply -auto-approve -lock-timeout=5m -no-color

