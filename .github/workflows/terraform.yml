name: Terraform

on:
  workflow_dispatch:
  # pull_request:
  #   paths: ["terraform/**"]   # plan-only on PRs; apply stays gated below

# One Terraform run at a time, shared with the destroy workflow
concurrency:
  group: terraform-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform/environments/prod

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN || 'arn:aws:iam::557797815982:role/github-actions-terraform' }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check (all modules)
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan -lock-timeout=5m -no-color

      - name: Plan summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Binary plan only: needed by apply, short retention.
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/prod/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN || 'arn:aws:iam::557797815982:role/github-actions-terraform' }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/prod

      - name: Init
        run: terraform init

      - name: Apply
        run: terraform apply -lock-timeout=5m -no-color tfplan