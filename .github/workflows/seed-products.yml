name: Seed Products

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL'
        required: true
        type: string
      products_file:
        description: 'Path to the products JSON file in the repo'
        required: true
        default: 'public/db.json'
        type: string

jobs:
  seed:
    name: Seed products via API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed products
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          ADMIN_USERNAME: ${{ secrets.SEED_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          python -m scripts.seed_products_api ${{ inputs.products_file }}
