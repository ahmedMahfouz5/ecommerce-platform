name: Helm test

on:
  # pull_request:
  #   paths: ["helm/**", "backend/**", "frontend/**", ".github/workflows/helm-test.yml"]
  # push:
  #   branches: [main]
  #   paths: ["helm/**", ".github/workflows/helm-test.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART: helm/ecommerce
  RELEASE: ecommerce            # ADJUST: service names below assume <release>-<component>

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4          # use the same major as your other workflows

      - uses: azure/setup-helm@v5.0.1

      - name: Helm lint
        run: >
          helm lint $CHART
          --set backend.image.tag=ci
          --set frontend.image.tag=ci

      - name: Render templates
        run: >
          helm template $RELEASE $CHART
          --set backend.image.tag=ci
          --set frontend.image.tag=ci > rendered.yaml

      - name: Validate with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml

  kind-install:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: docker/setup-buildx-action@v3

      # Build from this commit and load into kind, because the SHA image
      # may not exist on Docker Hub (pull requests never push).
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: ecommerce-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: ecommerce-frontend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: get clusters
        run: kind get clusters

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ecommerce-ci

      - name: Load images into kind
        run: |
          kind load docker-image ecommerce-backend:${{ github.sha }} --name ecommerce-ci
          kind load docker-image ecommerce-frontend:${{ github.sha }} --name ecommerce-ci
          
      # Throwaway CI-only values. ADJUST the secret name and keys to match your chart.
      - name: Create Secret
        run: |
          kubectl create secret generic ecommerce-secrets \
            --from-literal=POSTGRES_PASSWORD=ci-only-password \
            --from-literal=SECRET_KEY=ci-only-secret \
            --from-literal=DATABASE_URL=postgresql+asyncpg://postgres:ci-only-password@${RELEASE}-postgres:5432/ecommerce

      - name: Helm install
        run: >
          helm install $RELEASE $CHART
          --set backend.image.repository=ecommerce-backend
          --set backend.image.tag=${{ github.sha }}
          --set backend.image.pullPolicy=IfNotPresent
          --set frontend.image.repository=ecommerce-frontend
          --set frontend.image.tag=${{ github.sha }}
          --set frontend.image.pullPolicy=IfNotPresent
          --wait --timeout 5m

      - name: Smoke test
        run: |
          kubectl port-forward svc/${RELEASE}-backend 8000:8000 &
          kubectl port-forward svc/${RELEASE}-frontend 8080:8080 &
          sleep 5
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused localhost:8000/api/v1/health/live
          curl -fsS localhost:8000/api/v1/health/ready
          curl -fsS localhost:8080/api/v1/products

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods,svc,jobs
          kubectl describe pods
          kubectl logs --all-containers --prefix -l app.kubernetes.io/instance=$RELEASE --tail=100 || true