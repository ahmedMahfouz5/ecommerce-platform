name: Helm test

on:
  # pull_request:
  #   paths: ["helm/**", "backend/**", "frontend/**", ".github/workflows/helm-test.yml"]
  # push:
  #   branches: [main]
  #   paths: ["helm/**", ".github/workflows/helm-test.yml"]
  workflow_dispatch:
    inputs:
      debug_ssh:
        description: "Open a tmate SSH session if the job fails"
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: postgresql,       chart: helm/postgresql, values: helm/postgresql/values-local.yaml, set: "" }
          - { name: backend,          chart: helm/backend,  values: helm/backend/values.yaml,          set: "--set image.tag=ci" }
          - { name: backend-dev,      chart: helm/backend,  values: helm/backend/values-dev.yaml,      set: "--set image.tag=ci" }
          - { name: backend-staging,  chart: helm/backend,  values: helm/backend/values-staging.yaml,  set: "--set image.tag=ci" }
          - { name: backend-prod,     chart: helm/backend,  values: helm/backend/values-prod.yaml,     set: "--set image.tag=ci" }
          - { name: frontend,         chart: helm/frontend, values: helm/frontend/values.yaml,         set: "--set image.tag=ci" }
          - { name: frontend-dev,     chart: helm/frontend, values: helm/frontend/values-dev.yaml,     set: "--set image.tag=ci" }
          - { name: frontend-prod,    chart: helm/frontend, values: helm/frontend/values-prod.yaml,    set: "--set image.tag=ci" }
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1

      - name: Helm lint
        run: helm lint ${{ matrix.chart }} -f ${{ matrix.values }} ${{ matrix.set }}

      - name: Helm template
        run: helm template test ${{ matrix.chart }} -f ${{ matrix.values }} ${{ matrix.set }} > rendered.yaml

      - name: Validate with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          # The CRDs catalog covers ServiceMonitor (enabled in backend values-prod.yaml)
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

  kind-install:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1

      - name: get clusters
        run: kind get clusters

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ecommerce-ci
      - name: Get Cluster DNS Resolver
        run: |
          DNS_IP=$(kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}')
          echo "DNS resolver IP is: $DNS_IP"
          echo "NGINX_LOCAL_RESOLVERS=$DNS_IP" >> $GITHUB_ENV

      # Throwaway CI-only values. The database-url host is "postgres"
      # because the Bitnami PostgreSQL chart uses fullnameOverride: postgres.
      - name: Create Secret
        run: |
            kubectl create secret generic ecommerce-secret \
              --from-literal=DATABASE_URL='postgresql+asyncpg://postgres:ci-only-password@postgres:5432/ecommerce' \
              --from-literal=SECRET_KEY=ci-only-secret \
              --from-literal=postgres-password=ci-only-password

      - name: Install Postgres
        run: |
          helm upgrade --install postgres helm/postgresql \
            -f helm/postgresql/values-local.yaml \
            --debug --wait --timeout 10m
      - name: Run database migration
        run: |
          kubectl apply -f ./migration/job.yaml
          kubectl wait \
            --for=condition=complete \
            --timeout=300s \
            job/backend-migration

      - name: Install Backend
        run: |
          helm upgrade --install backend helm/backend \
            --set image.pullPolicy=IfNotPresent \
            --debug --wait --timeout 5m

      - name: Install Frontend
        run: |
          helm upgrade --install frontend helm/frontend \
            --set image.pullPolicy=IfNotPresent \
            --set nginx.localResolvers="$NGINX_LOCAL_RESOLVERS" \
            --set backendUrl="http://backend.default.svc.cluster.local:8000" \
            --debug --wait --timeout 5m

      - name: Smoke test
        run: |
          cleanup() { kill $(jobs -p) 2>/dev/null; }
          trap cleanup EXIT

          kubectl port-forward svc/backend 8000:8000 &
          kubectl port-forward svc/frontend 8080:8080 &
          sleep 5

          echo "=== Backend: Liveness check ==="
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused localhost:8000/api/v1/health/live
          echo ""

          echo "=== Backend: Readiness check ==="
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused localhost:8000/api/v1/health/ready
          echo ""

          echo "=== Backend: Products endpoint ==="
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused localhost:8000/api/v1/products
          echo ""

          echo "=== Frontend: Healthz check ==="
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused localhost:8080/healthz
          echo ""

          echo "=== Frontend: Products endpoint (proxied to backend) ==="
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused localhost:8080/api/v1/products
          echo ""

          echo "=== Frontend: Static assets ==="
          curl -fsS --retry 5 --retry-delay 2 --retry-connrefused -o /dev/null -w "HTTP %{http_code}" localhost:8080/
          echo ""

      - name: Debug on failure
        if: failure()
        run: |
          echo "===== Migration Job ====="
          kubectl describe job backend-migration -n default || true
          echo "===== Migration Pods ====="
          kubectl get pods -n default -l job-name=backend-migration -o wide || true
          echo "===== Migration Pod Logs ====="
          kubectl logs -n default -l job-name=backend-migration --all-containers --tail=200 || true
          echo "===== Events ====="
          kubectl get events -n default --sort-by='.lastTimestamp' | tail -40 || true
          kubectl get pods,svc,jobs,statefulsets,deployments
          echo "=========================================================================================="
          kubectl describe pods
          echo "=========================================================================================="
          kubectl logs --all-containers --prefix -l app.kubernetes.io/managed-by=Helm --tail=100 || true
          echo "=========================================================================================="
          helm list --all-namespaces
          echo "=========================================================================================="
          kubectl logs job/backend-migration --tail=50 || true
          echo "=========================================================================================="
          kubectl describe job backend-migration || true
                    echo "===== backend container logs ====="
          kubectl logs deployment/backend --previous --tail=200 || true

          echo "===== Frontend container logs ====="
          kubectl logs deployment/frontend --previous --tail=200 || true

          echo "===== Current frontend logs ====="
          kubectl logs deployment/frontend --tail=200 || true

          echo "===== Frontend pod events ====="
          kubectl describe pod -l app.kubernetes.io/name=frontend

          echo "===== Frontend deployment ====="
          kubectl describe deployment frontend
          kubectl exec deployment/frontend -- cat /etc/nginx/conf.d/default.conf
          

      - name: Debug SSH session
        if: ${{ failure() && inputs.debug_ssh }}
        uses: mxschmitt/action-tmate@v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true