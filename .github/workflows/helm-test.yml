name: Helm test

on:
  # pull_request:
  #   paths: ["helm/**", "backend/**", "frontend/**", ".github/workflows/helm-test.yml"]
  # push:
  #   branches: [main]
  #   paths: ["helm/**", ".github/workflows/helm-test.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        chart: [helm/postgres, helm/backend, helm/frontend]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1

      - name: Set image tag args
        id: args
        run: |
          case "${{ matrix.chart }}" in
            helm/backend|helm/frontend)
              echo "extra=--set image.tag=ci" >> $GITHUB_OUTPUT ;;
            *)
              echo "extra=" >> $GITHUB_OUTPUT ;;
          esac

      - name: Helm lint
        run: helm lint ${{ matrix.chart }} ${{ steps.args.outputs.extra }}

      - name: Helm template
        run: |
          helm template test ${{ matrix.chart }} ${{ steps.args.outputs.extra }} > rendered.yaml

      - name: Validate with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml

  kind-install:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      # Build from this commit and load into kind, because the SHA image
      # may not exist on Docker Hub (pull requests never push).
      - name: Build backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          tags: ecommerce-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          tags: ecommerce-frontend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: get clusters
        run: kind get clusters

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ecommerce-ci

      - name: Load images into kind
        run: |
          kind load docker-image ecommerce-backend:${{ github.sha }} --name ecommerce-ci
          kind load docker-image ecommerce-frontend:${{ github.sha }} --name ecommerce-ci

      # Throwaway CI-only values. The database-url host is "postgres"
      # because the Postgres chart uses fullnameOverride: postgres.
      - name: Create Secret
        run: |
          kubectl create secret generic ecommerce-secret \
            --from-literal=database-url='postgresql+asyncpg://postgres:ci-only-password@postgres:5432/ecommerce' \
            --from-literal=secret-key=ci-only-secret \
            --from-literal=postgres-password=ci-only-password

      - name: Install Postgres
        run: |
          helm upgrade --install postgres helm/postgres --wait --timeout 5m

      - name: Install Backend
        run: |
          helm upgrade --install backend helm/backend \
            --set image.repository=ecommerce-backend \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 10m

      - name: Install Frontend
        run: |
          helm upgrade --install frontend helm/frontend \
            --set image.repository=ecommerce-frontend \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 5m

      - name: Smoke test
        run: |
          kubectl port-forward svc/backend 8000:8000 &
          kubectl port-forward svc/frontend 8080:8080 &
          sleep 5
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused localhost:8000/api/v1/health/live
          curl -fsS localhost:8000/api/v1/health/ready
          curl -fsS localhost:8080/api/v1/products

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods,svc,jobs,statefulsets,deployments
          echo "=========================================================================================="
          kubectl describe pods
          echo "=========================================================================================="
          kubectl logs --all-containers --prefix -l app.kubernetes.io/managed-by=Helm --tail=100 || true
          echo "=========================================================================================="
          helm list --all-namespaces
          echo "=========================================================================================="
          kubectl logs job/backend-migration --tail=50 || true
          echo "=========================================================================================="
          kubectl describe job backend-migration || true