name: Release Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  detect-changes:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  docker-push:
    needs: [release-please, detect-changes]
    #if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - name: Check if backend changed
        id: check
        env:
          CHANGED: ${{ needs.detect-changes.outputs.backend }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes in backend. Skipping."
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.check.outputs.skip == 'false' }}

      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.check.outputs.skip == 'false' }}

      - name: Login to Docker Hub
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ahmedmahfouz0/backend
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build image (no push yet)
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/build-push-action@v7
        id: build
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test
        if: ${{ steps.check.outputs.skip == 'false' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          COMPONENT: backend
          PORT: 8000
          HEALTH_ENDPOINT: /api/v1/health
          RETRIES: 30
          RETRY_DELAY: 2
        run: |
          IMAGE=$(echo "$TAGS" | cut -d',' -f1)
          export IMAGE
          ./scripts/smoke-test.sh

      - name: Push image
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          provenance: mode=max
          sbom: true

      - name: Output image tag (always set, even if skipped)
        id: image-tag
        if: always()
        run: |
          if [[ "${{ steps.check.outputs.skip }}" == "false" ]]; then
            TAG="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  update-helm-values:
    needs: [docker-push]
    if: |
      always() &&
      needs.docker-push.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Update image tag in Helm values
        env:
          IMAGE_TAG: ${{ needs.docker-push.outputs.image_tag }}
        run: |
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "No image tag to update. Skipping."
            exit 0
          fi

          VALUES_FILE="helm/backend/values.yaml"
          echo "Updating $VALUES_FILE with tag: $IMAGE_TAG"

          # Replace the tag line. The pattern matches `tag: "..."` under the `image:` key.
          sed -i "s/^  tag: \".*\"/  tag: \"$IMAGE_TAG\"/" "$VALUES_FILE"

          echo "Updated values.yaml:"
          grep -n 'tag:' "$VALUES_FILE"

