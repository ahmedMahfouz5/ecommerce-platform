name: Release Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and push even if nothing under backend/ changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: ahmedmahfouz0/backend
  HELM_VALUES_FILE: helm/backend/values.yaml
  MIGRATION_JOB_FILE: migration/job.yaml

jobs:
  # ---------------------------------------------------------------------------
  # 1. release-please: opens/updates the Release PR on every push to main and
  #    creates the tag + GitHub Release when that PR is merged.
  # ---------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # NOTE: if release-please-config.json defines a package with
      # "path": "backend", outputs are prefixed. In that case use:
      #   steps.release.outputs['backend--release_created']
      #   steps.release.outputs['backend--version']
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # 2. detect-changes: independent of release-please, so it runs in parallel.
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/smoke-test.sh'

  # ---------------------------------------------------------------------------
  # 3. docker-push: build -> smoke test -> push.
  #    Runs when backend code changed, a release was just created, or forced.
  # ---------------------------------------------------------------------------
  docker-push:
    needs: [release-please, detect-changes]
    if: >-
      ${{
        inputs.force_build ||
        needs.detect-changes.outputs.backend == 'true' ||
        needs.release-please.outputs.release_created == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ needs.release-please.outputs.release_created == 'true' }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }},enable=${{ env.IS_RELEASE }}

      - name: Build image (local only, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          COMPONENT: backend
          PORT: 8000
          HEALTH_ENDPOINT: /api/v1/health
          RETRIES: 30
          RETRY_DELAY: 2
        run: ./scripts/smoke-test.sh

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true

  # ---------------------------------------------------------------------------
  # 4. update-helm-values: GitOps step. Writes the new image tag into the repo
  #    in a single commit (Helm values + migration job).
  # ---------------------------------------------------------------------------
  update-helm-values:
    needs: docker-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialise with release-frontend.yml so the two never push at the same time
    concurrency:
      group: helm-values-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in Helm values and migration job
        env:
          IMAGE_TAG: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          yq -i '.image.tag = strenv(IMAGE_TAG) | .image.tag style="double"' "$HELM_VALUES_FILE"
          sed -i -E "s|(image: ${IMAGE_NAME}:).*|\1${IMAGE_TAG}|" "$MIGRATION_JOB_FILE"

          git diff -- "$HELM_VALUES_FILE" "$MIGRATION_JOB_FILE"

          if git diff --quiet -- "$HELM_VALUES_FILE" "$MIGRATION_JOB_FILE"; then
            echo "Tag already ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HELM_VALUES_FILE" "$MIGRATION_JOB_FILE"
          git commit -m "chore: update backend image tag to ${IMAGE_TAG} [skip ci]"

          # Retry in case another workflow pushed in the meantime
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 3))
          done

          echo "::error::Could not push image tag update after 3 attempts"
          exit 1