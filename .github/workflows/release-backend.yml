name: Release Backend

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and push even if nothing under backend/ changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-backend
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  detect-changes:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/smoke-test.sh'

  docker-push:
    needs: [release-please, detect-changes]
    if: ${{ inputs.force_build || needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ahmedmahfouz0/backend
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created == 'true' }}

      - name: Build image (no push yet, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test
        env:
          IMAGE: ahmedmahfouz0/backend:${{ github.sha }}
          COMPONENT: backend
          PORT: 8000
          HEALTH_ENDPOINT: /api/v1/health
          RETRIES: 30
          RETRY_DELAY: 2
        run: ./scripts/smoke-test.sh

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true

  update-helm-values:
    needs: docker-push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialise with release-frontend.yml so the two never push at the same time
    concurrency:
      group: helm-values-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in Helm values
        env:
          IMAGE_TAG: ${{ github.sha }}
          VALUES_FILE: helm/backend/values.yaml
          BRANCH: ${{ github.ref_name }}
        run: |
          yq -i '.image.tag = strenv(IMAGE_TAG) | .image.tag style="double"' "$VALUES_FILE"
          grep -n '^  tag:' "$VALUES_FILE"

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "Tag already ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "chore: update backend image tag to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"