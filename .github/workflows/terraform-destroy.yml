name: "Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform/environments/prod

jobs:
  plan-destroy:
    name: "Plan Destroy"
    runs-on: ubuntu-24.04
    steps:
      - name: Check confirmation
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation text did not match. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::557797815982:role/github-actions-terraform
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (destroy)
        run: terraform plan -destroy -out=destroy.tfplan -no-color

      - name: Export plan to readable text
        run: terraform show -no-color destroy.tfplan > destroy-plan.txt

      - name: Add plan to run summary
        run: |
          echo '### Destroy plan (prod)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat destroy-plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: |
            terraform/environments/prod/destroy.tfplan
            terraform/environments/prod/destroy-plan.txt
          retention-days: 1

  destroy:
    name: "Destroy"
    needs: plan-destroy
    runs-on: ubuntu-24.04
    # Create this environment (Settings > Environments) and add required reviewers
    environment: prod-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::557797815982:role/github-actions-terraform
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: terraform/environments/prod

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy (apply saved plan)
        run: terraform apply -input=false destroy.tfplan