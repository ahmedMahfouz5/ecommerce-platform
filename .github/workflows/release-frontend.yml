name: Release Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build and push even if nothing under frontend/ changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-frontend
  cancel-in-progress: false

env:
  IMAGE_NAME: ahmedmahfouz0/frontend
  HELM_VALUES_FILE: helm/frontend/values.yaml

jobs:
  # ---------------------------------------------------------------------------
  # 1. release-please
  #    WARNING: release-backend.yml runs the same job against the same config.
  #    Two copies race each other (see notes in the chat). Keep this job in only
  #    ONE workflow once you consolidate.
  # ---------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # 2. detect-changes: independent of release-please, runs in parallel.
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/smoke-test-frontend.sh'

  # ---------------------------------------------------------------------------
  # 3. trivy-fs-scan: filesystem vulnerability, misconfig & secret scan.
  # ---------------------------------------------------------------------------
  trivy-fs-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: frontend/
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-fs-results.sarif

      - name: Upload Trivy FS results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
  # ---------------------------------------------------------------------------
  # 4. docker-push: build -> Trivy image scan -> smoke test -> push.
  # ---------------------------------------------------------------------------
  docker-push:
    needs: [release-please, detect-changes, trivy-fs-scan]
    if: >-
      ${{
        inputs.force_build ||
        needs.detect-changes.outputs.frontend == 'true' ||
        needs.release-please.outputs.release_created == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ needs.release-please.outputs.release_created == 'true' }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      BUILD_VERSION: ${{ needs.release-please.outputs.version || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ env.RELEASE_VERSION }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_VERSION }},enable=${{ env.IS_RELEASE }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_VERSION }},enable=${{ env.IS_RELEASE }}

      - name: Build image (local only, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ env.BUILD_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          BACKEND_URL: http://backend:8000
        run: ./scripts/smoke-test-frontend.sh

      - name: Trivy image scan (blocking on CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1
          timeout: 10m
          format: sarif
          output: trivy-image-results.sarif

      - name: Upload Trivy image results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ env.BUILD_VERSION }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # 5. update-helm-values: GitOps step, writes the new tag into the repo.
  # ---------------------------------------------------------------------------
  update-helm-values:
    needs: [docker-push, trivy-fs-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialise with release-backend.yml so the two never push at the same time
    concurrency:
      group: helm-values-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in Helm values
        env:
          IMAGE_TAG: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          yq -i '.image.tag = strenv(IMAGE_TAG) | .image.tag style="double"' "$HELM_VALUES_FILE"
          git diff -- "$HELM_VALUES_FILE"

          if git diff --quiet -- "$HELM_VALUES_FILE"; then
            echo "Tag already ${IMAGE_TAG}; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HELM_VALUES_FILE"
          git commit -m "chore: update frontend image tag to ${IMAGE_TAG} [skip ci]"

          # Retry in case another workflow pushed in the meantime
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 3))
          done

          echo "::error::Could not push image tag update after 3 attempts"
          exit 1