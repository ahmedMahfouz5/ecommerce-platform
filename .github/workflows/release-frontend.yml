name: Release Frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  detect-changes:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  docker-push:
    needs: [release-please, detect-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check if frontend changed
        id: check
        env:
          CHANGED: ${{ needs.detect-changes.outputs.frontend }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes in frontend. Skipping."
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.check.outputs.skip == 'false' }}

      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.check.outputs.skip == 'false' }}

      - name: Login to Docker Hub
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ahmedmahfouz0/frontend
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build image (no push yet — for smoke test)
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/build-push-action@v7
        id: build
        with:
          context: frontend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REVISION=${{ needs.release-please.outputs.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test
        if: ${{ steps.check.outputs.skip == 'false' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          BACKEND_URL: http://backend:8000
        run: |
          IMAGE=$(echo "$TAGS" | cut -d',' -f1)
          export IMAGE
          ./scripts/smoke-test-frontend.sh

      - name: Push image
        if: ${{ steps.check.outputs.skip == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REVISION=${{ needs.release-please.outputs.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
