server {
    listen       8080;
    server_name  _;

    # --- gzip ---
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;

    # --- API proxy to backend ---
    location /api/ {
        # Default via envsubst; override with BACKEND_URL at runtime.
        # Using a variable forces per-request DNS resolution so nginx
        # picks up IP changes after backend container restarts.
        set $backend_url "${BACKEND_URL:-http://backend:8000}";
        proxy_pass $backend_url;

        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    # --- SPA static files ---
    root /usr/share/nginx/html;

    # index.html must never be cached (so new deploys take effect)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed JS/CSS/assets get long-lived immutable cache
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback to index.html for SPA client-side routing
    location / {
        try_files $uri /index.html;
    }
}