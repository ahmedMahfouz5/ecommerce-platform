# =============================================================================
# Nginx configuration TEMPLATE for envsubst
#
# Environment variables consumed at container startup (by the
# nginx-unprivileged entrypoint /docker-entrypoint.d/):
#
#   BACKEND_URL            – full upstream URL, e.g. http://backend:8000
#   NGINX_LOCAL_RESOLVERS  – DNS resolver(s), auto-detected or overridden
#   PROXY_READ_TIMEOUT     – proxy_read_timeout in seconds (default: 60s)
#   CLIENT_MAX_BODY_SIZE   – client_max_body_size       (default: 1m)
#
# Nginx's own variables ($uri, $host, $remote_addr, …) are preserved
# because envsubst only replaces ${NAME} patterns and nginx uses plain $name.
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name  _;
    server_tokens off;

    # ---- timeouts & limits ----
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    # ---- gzip ----
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;

    # ---- security headers ----
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "interest-cohort=()" always;

    # ---- DNS resolver (for variable-based proxy_pass) ----
    # Must be set; /docker-entrypoint.d/15-local-resolvers.envsh auto-detects
    # from /etc/resolv.conf and exports NGINX_LOCAL_RESOLVERS.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # ---- backend proxy ----
    location /api/ {
        # Variable holds the *full* backend URL including scheme/host/port.
        # Using a variable forces nginx to re-resolve DNS at each request,
        # so it starts even if the backend Service is not yet reachable.
        set $backend_url "${BACKEND_URL}";
        proxy_pass $backend_url;

        proxy_http_version      1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout    5s;
        proxy_read_timeout       ${PROXY_READ_TIMEOUT};
    }

    # ---- health endpoint (liveness + readiness) ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- static assets ----
    root /usr/share/nginx/html;

    # Never cache index.html (so new deploys are picked up).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache hashed assets (fingerprinted by Vite).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri /index.html;
    }
}