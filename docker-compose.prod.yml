services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:change-me-in-production@db:5432/ecommerce}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      S3_ASSETS_BUCKET: ${S3_ASSETS_BUCKET:-ecommerce-staging-us-east-2-assets}
      S3_PRESIGNED_URL_EXPIRATION_SECONDS: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:8000
      PROXY_READ_TIMEOUT: 60s
      CLIENT_MAX_BODY_SIZE: 1m
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  postgres_data_prod:
    driver: local

networks:
  app-net:
    driver: bridge
